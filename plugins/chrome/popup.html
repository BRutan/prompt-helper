<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>prompt-helper</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{font:13px system-ui,-apple-system,sans-serif;background:#101827;color:#eef3fb;width:360px;margin:0;padding:16px}
  body.standalone{width:auto;min-width:340px}
  h1{font-size:17px;margin:0 0 16px}
  h2{font-size:14px;margin:0}
  p{line-height:1.45;color:#b9c7da}
  .hidden{display:none!important}
  .home-actions{display:grid;gap:9px}
  button{font:inherit;background:#5985c8;color:#fff;border:0;border-radius:7px;padding:10px 12px;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.secondary{background:#223b5a;border:1px solid #536b88}
  button:focus-visible,input:focus-visible{outline:2px solid #b7dcff;outline-offset:2px}
  .home-actions>button{width:100%;min-height:42px;text-align:left;font-weight:600}
  .toggle-button{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#223b5a;border:1px solid #536b88}
  .toggle-pill{border-radius:12px;padding:4px 10px;background:#2d8260;font-size:11px;letter-spacing:.07em;min-width:47px;text-align:center}
  .toggle-button[aria-pressed="false"] .toggle-pill{background:#784452}
  .subhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .subhead .back{padding:6px 10px;background:#223b5a;border:1px solid #536b88;min-width:56px}
  .form-fields{display:grid;gap:12px}
  .field-label{display:grid;gap:6px;font-weight:600}
  input[type=number]{background:#23344c;color:#fff;border:1px solid #496282;border-radius:6px;padding:9px;width:100%}
  .check-label{display:flex;gap:9px;align-items:flex-start;line-height:1.45}
  .check-label input{margin-top:3px;accent-color:#5985c8}
  #save{justify-self:start}
  #settings-status{color:#8ce5ba;margin:0;min-height:16px}
  #error{color:#ffa9a9;white-space:pre-wrap;margin-top:12px}
  .counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .count{padding:9px;border:1px solid #32465f;border-radius:8px;background:#1b283a}
  .count strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .count span{color:#bfcede}
  .session-list{max-height:365px;overflow:auto;display:grid;gap:7px;margin-top:10px}
  .session{display:block;text-align:left;width:100%;margin:0;background:#18263a;border:1px solid #3c526f;color:#eff6ff;overflow:hidden}
  .session:hover,.session:focus-visible{background:#29415f}
  .session .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .session small{display:block;color:#afc1d5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
  .session-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .muted{color:#a6b7cd;font-size:12px}
</style>
</head>
<body>
<h1>prompt-helper</h1>
<section id="home-view" aria-label="Main menu">
  <div class="home-actions">
    <button id="sessions-button" type="button">Sessions</button>
    <button id="settings-button" type="button">Settings</button>
    <button id="dashboard-button" type="button">Open dashboard</button>
    <button id="enabled-toggle" class="toggle-button" type="button" aria-pressed="true" aria-label="Turn prompt-helper off">
      <span>Prompt-helper</span><span id="enabled-state" class="toggle-pill">ON</span>
    </button>
  </div>
</section>
<section id="sessions-view" class="hidden" aria-label="Open sessions">
  <div class="subhead"><button id="sessions-back" class="back" type="button">← Back</button><h2>Sessions</h2></div>
  <div class="counts">
    <div class="count"><strong id="chatgpt-count">0</strong><span>ChatGPT sessions</span></div>
    <div class="count"><strong id="claude-count">0</strong><span>Claude sessions</span></div>
  </div>
  <p class="muted">Select a conversation to focus its existing tab and window.</p>
  <div class="session-actions">
    <button id="refresh-sessions" class="secondary" type="button">Refresh</button>
    <button id="arrange-sessions" type="button">Arrange sessions</button>
  </div>
  <div id="session-list" class="session-list" role="list" aria-label="Open LLM conversations"></div>
</section>
<section id="settings-view" class="hidden" aria-label="Settings">
  <div class="subhead"><button id="settings-back" class="back" type="button">← Back</button><h2>Settings</h2></div>
  <div class="form-fields">
    <label class="field-label" for="minimum">Minimum source characters<input id="minimum" type="number" min="100" max="1000000"></label>
    <label class="check-label"><input id="replace" type="checkbox"> Replace eligible pasted source automatically</label>
    <label class="check-label"><input id="symbol-compression" type="checkbox"> Code symbol compression by dialect (Git patches)</label>
    <button id="save" type="button">Save settings</button>
    <p id="settings-status" role="status" aria-live="polite"></p>
  </div>
</section>
<p id="error" role="alert"></p>
<script type="module" src="popup.js"></script>
</body></html>
