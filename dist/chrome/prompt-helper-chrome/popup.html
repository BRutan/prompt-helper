<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>prompt-helper session diff</title>
<style>
  body{font:13px system-ui,sans-serif;background:#101827;color:#eef3fb;width:340px;margin:0;padding:16px}
  h1{font-size:16px;margin:0 0 10px} p{line-height:1.5;color:#b9c7da} .status{padding:10px;background:#1c2a3f;border-radius:7px;white-space:pre-wrap}
  input{background:#23344c;color:#fff;border:1px solid #496282;border-radius:4px;padding:6px;box-sizing:border-box;width:100%}
  label{display:block;margin:12px 0 4px} button{background:#5985c8;color:white;border:none;border-radius:5px;padding:9px 12px;cursor:pointer;margin:10px 6px 0 0}
  #error{color:#ffa9a9;white-space:pre-wrap} #diff{width:100%;height:120px;background:#121e2e;color:#d9e5f4;margin-top:10px}
</style>
</head>
<body>
<h1>prompt-helper · session diff</h1>
<p id="where">Detecting active conversation…</p>
<div id="status" class="status">No source processed yet.</div>
<button id="load">Load session diff</button><button id="copy">Copy diff</button>
<textarea id="diff" readonly placeholder="The current conversation's combined diff will appear here."></textarea>
<label for="endpoint">Local prompt-helper URL</label><input id="endpoint" type="text" spellcheck="false">
<label for="minimum">Minimum source characters</label><input id="minimum" type="number" min="100" max="1000000">
<label><input id="replace" type="checkbox" style="width:auto"> Replace eligible pasted source automatically</label>
<button id="save">Save settings</button><p id="error" role="alert"></p>
<script type="module" src="popup.js"></script>
</body></html>
