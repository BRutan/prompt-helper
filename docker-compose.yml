name: prompterr
services:
  frontend:
    container_name: prompterr-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PROMPTERR_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [prompterr-backend]
    restart: unless-stopped

  backend:
    container_name: prompterr-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: prompterr
      DB_USER: prompterr
      DB_PASSWORD: ${PROMPTERR_DB_PASSWORD:-prompterr_dev_only}
      LISTEN_ADDR: :8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/prompterr", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [prompterr-backend]
    restart: unless-stopped

  db:
    container_name: prompterr-db
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: prompterr
      POSTGRES_USER: prompterr
      POSTGRES_PASSWORD: ${PROMPTERR_DB_PASSWORD:-prompterr_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompterr -d prompterr"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [prompterr-backend]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  prompterr-backend:
    name: prompterr-backend
    driver: bridge
