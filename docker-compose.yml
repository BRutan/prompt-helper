name: prompt-helper

# Shared by every service. The Chrome build also reads IS_LOCAL on the host.
x-common-env: &common-env
  IS_LOCAL: ${IS_LOCAL:-1}

services:
  frontend:
    container_name: prompt-helper-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PROMPT_HELPER_PORT:-5173}:80"
    environment:
      <<: *common-env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/data
    networks: [prompt-helper-backend]
    restart: unless-stopped

  backend:
    container_name: prompt-helper-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      DB_HOST: db
      DB_NAME: prompt-helper
      DB_USER: prompt-helper
      DB_PASSWORD: ${PROMPT_HELPER_DB_PASSWORD:-prompt-helper_dev_only}
      LISTEN_ADDR: :8080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/prompt-helper", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [prompt-helper-backend]
    restart: unless-stopped

  db:
    container_name: prompt-helper-db
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      POSTGRES_DB: prompt-helper
      POSTGRES_USER: prompt-helper
      POSTGRES_PASSWORD: ${PROMPT_HELPER_DB_PASSWORD:-prompt-helper_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt-helper -d prompt-helper"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [prompt-helper-backend]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  prompt-helper-backend:
    name: prompt-helper-backend
    driver: bridge
